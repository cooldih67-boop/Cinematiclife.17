name: Update Instagram Stats

on:
  schedule:
    # Runs every 4 hours. Change the cron expression below if you want a different frequency.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}  # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Fetch account stats and latest post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          curl -s "https://graph.instagram.com/v21.0/${IG_USER_ID}?fields=followers_count,follows_count,media_count&access_token=${IG_ACCESS_TOKEN}" -o account.json

          curl -s "https://graph.instagram.com/v21.0/${IG_USER_ID}/media?fields=id,caption,media_type,media_url,thumbnail_url,permalink,timestamp&limit=1&access_token=${IG_ACCESS_TOKEN}" -o media.json

          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          with open('account.json') as f:
              account = json.load(f)
          with open('media.json') as f:
              media = json.load(f)

          latest = media.get('data', [{}])[0] if media.get('data') else {}

          output = {**account, 'latest_post': latest, 'updated_at': datetime.now(timezone.utc).isoformat()}

          with open('stats.json', 'w') as f:
              json.dump(output, f, indent=2)
          PY

          cat stats.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Instagram stats"
          git push
