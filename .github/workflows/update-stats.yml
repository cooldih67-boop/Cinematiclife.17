name: Update Instagram Stats

on:
  schedule:
    # Runs every 4 hours. Change the cron expression below if you want a different frequency.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}  # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Fetch stats from Instagram Graph API
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          curl -s "https://graph.instagram.com/v21.0/${IG_USER_ID}?fields=followers_count,follows_count,media_count&access_token=${IG_ACCESS_TOKEN}" \
            -o stats.json
          cat stats.json

      - name: Add timestamp to stats file
        run: |
          python3 -c "
import json
from datetime import datetime, timezone

with open('stats.json') as f:
    data = json.load(f)

data['updated_at'] = datetime.now(timezone.utc).isoformat()

with open('stats.json', 'w') as f:
    json.dump(data, f, indent=2)
"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Instagram stats"
          git push
